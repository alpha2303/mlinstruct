[project]
name = "mlinstruct"
version = "0.4.0"
description = "Python library for managing ML model training instances and evaluation graph generation"
readme = "README.md"
authors = [{ name = "Rahul Pavithran", email = "rahul.pavi@outlook.com" }]
license = { text = "MIT" }
requires-python = "<4.0,>=3.12"
dependencies = [
    "numpy>=1.26,<3",
    "matplotlib>=3.8,<4",
    "scikit-learn>=1.5,<2",
]

[project.optional-dependencies]
torch = [
    "torch>=2.6",
    "torchinfo>=1.8,<2",
]
torch-cuda = [
    "torch>=2.6",
    "torchinfo>=1.8,<2",
]
progress = ["tqdm>=4.66,<5"]
onnx = [
    "onnx>=1.16,<2",
    "onnxscript>=0.1,<1",
]

[project.urls]
repository = "https://github.com/alpha2303/mlinstruct"

[dependency-groups]
test = [
    "pytest<9.0.0,>=8.1.1",
    "pytest-mock<4.0.0,>=3.14.0",
    "pytest-cov<7.0.0,>=5.0.0",
    "onnxruntime>=1.19,<2",
]
dev = ["ruff>=0.7,<1", "pyright>=1.1,<2"]

[tool.uv]
conflicts = [[{ extra = "torch" }, { extra = "torch-cuda" }]]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "torch" },
    { index = "pytorch-cu126", extra = "torch-cuda" },
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--cov=mlinstruct --cov-report=term-missing"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]

[tool.pyright]
typeCheckingMode = "basic"
