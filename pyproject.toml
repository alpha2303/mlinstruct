[project]
name = "mlinstruct"
version = "0.1.1"
description = "Python library for managing ML model training instances and evaluation graph generation"
readme = "README.md"
authors = [{ name = "Rahul Pavithran", email = "rahul.pavi@outlook.com" }]
license = { text = "MIT" }
requires-python = "<4.0,>=3.12"
dependencies = [
    "numpy>=1.26,<3",
    "matplotlib>=3.8,<4",
    "scikit-learn>=1.5,<2",
]

[project.optional-dependencies]
torch = [
    "torch>=2.6",
    "torchinfo>=1.8,<2",
]

[project.urls]
repository = "https://github.com/alpha2303/mlinstruct"

[dependency-groups]
test = ["pytest<9.0.0,>=8.1.1", "pytest-mock<4.0.0,>=3.14.0", "pytest-cov<7.0.0,>=5.0.0"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
