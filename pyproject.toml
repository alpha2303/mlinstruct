[project]
name = "mlinstruct"
version = "0.1.0"
description = "Python library for managing ML model training instances and evaluation graph generation"
readme = "README.md"
authors = [{ name = "Rahul Pavithran", email = "rahul.pavithran99@gmail.com" }]
license = { text = "MIT" }
requires-python = "<4.0,>=3.11"
dependencies = [
    "numpy<2.0.0,>=1.26.2",
    "matplotlib<4.0.0,>=3.6.3",
    "torch<3.0.0,>=2.4.0",
    "torchvision<1.0.0,>=0.19.0",
    "scikit-learn<2.0.0,>=1.5.1",
    "torchinfo<2.0.0,>=1.8.0",
]

[project.urls]
repository = "https://github.com/alpha2303/mlinstruct"

[dependency-groups]
test = ["pytest<9.0.0,>=8.1.1", "pytest-mock<4.0.0,>=3.14.0"]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
    { index = "pytorch-cu124", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cpu" },
    { index = "pytorch-cu124", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[tool.pytest.ini_options]
pythonpath = ["."]
